    <!-- Boot mark: paints on the first frame, before any JavaScript. The React
         preloader mounts beneath it at the identical position, then takes over. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 101; display: grid; place-items: center; background: #070907; transition: opacity .4s ease; }

      #boot.is-gone { opacity: 0; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.72) rotate(-8deg); } to { opacity: 1; transform: none; } }
      .is-internal #boot img { animation: none; }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } #boot { transition: none; } }
    </style>
